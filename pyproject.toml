[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f5audit"
dynamic = ["version"]
description = "Read-only audit tool for F5 BIG-IP LTM: finds unused nodes, pools, virtual servers and monitors via iControl REST and produces an Excel report."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Israel Fernandez", email = "israelfdzhdz@gmail.com" }]
keywords = ["f5", "big-ip", "ltm", "audit", "icontrol-rest", "network-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.25",
    "openpyxl>=3.0",
]

[project.urls]
Homepage = "https://github.com/netcraftworks/f5audit"
Repository = "https://github.com/netcraftworks/f5audit"
Issues = "https://github.com/netcraftworks/f5audit/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
f5audit = "f5audit.cli:main"

[tool.setuptools.packages.find]
include = ["f5audit*"]

[tool.setuptools.dynamic]
version = { attr = "f5audit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
