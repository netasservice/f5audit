[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f5audit"
version = "0.1.0"
description = "Read-only audit tool for F5 BIG-IP LTM: finds unused nodes, pools, virtual servers and monitors via iControl REST and produces an Excel report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.25",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
f5audit = "f5audit.cli:main"

[tool.setuptools.packages.find]
include = ["f5audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
